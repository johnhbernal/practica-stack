# Full stack: Postgres (msauth + practica) + ms-auth + practica + ms-frontend
# Requires sibling clones:
#   ../ms-auth  ../practica  ../ms-frontend
#
# Usage:
#   copy .env.example .env
#   docker compose up --build
#   → http://localhost:3000  (login admin / Admin123!)
#   → http://localhost:8081/actuator/health
#   → http://localhost:8082/api/actuator/health

name: practica-stack

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackpass}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stack -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  ms-auth:
    build:
      context: ../ms-auth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # prod = Postgres+Flyway+hardening; stack = seed users for demos
      SPRING_PROFILES_ACTIVE: prod,stack
      APP_JWT_SECRET_MASTER: ${APP_JWT_SECRET_MASTER}
      APP_JWT_SECRET_SESSION: ${APP_JWT_SECRET_SESSION}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/msauth
      SPRING_DATASOURCE_USERNAME: stack
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-stackpass}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Feign appends /api — service DNS name on the compose network
      MS_PRACTICA_URL: http://microservicio-practica:8082
      JAVA_OPTS: ${JAVA_OPTS_AUTH:-}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  microservicio-practica:
    build:
      context: ../practica
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,stack
      APP_JWT_SECRET_MASTER: ${APP_JWT_SECRET_MASTER}
      APP_JWT_SECRET_SESSION: ${APP_JWT_SECRET_SESSION}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/practica
      SPRING_DATASOURCE_USERNAME: stack
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-stackpass}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JAVA_OPTS: ${JAVA_OPTS_PRACTICA:-}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ms-frontend:
    build:
      context: ../ms-frontend
      args:
        # Browser calls host-published ports (not Docker DNS names)
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-http://localhost:8081}
        VITE_PRACTICA_API_URL: ${VITE_PRACTICA_API_URL:-http://localhost:8082/api}
    depends_on:
      ms-auth:
        condition: service_healthy
      microservicio-practica:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
